title: Computer Science & Software Engineering Fundamentals
shortTitle: Engineering Fundamentals
description: >-
  A foundational engineering curriculum: how computers, operating systems,
  networks, databases and distributed systems work inside, and how to design,
  measure and secure the software built on them.
audience: >-
  Experienced software engineers, senior and staff/principal engineers, and
  software architects.
order: 2
objectives:
  - title: Engineering fundamentals
    description: >-
      Understand how computing systems work internally, beyond programming
      languages, frameworks and tools.
  - title: Engineering and architectural mastery
    description: >-
      Develop the skills to design, implement, debug, optimize and evaluate
      complex software systems.
  - title: Long-term technical relevance
    description: >-
      Build technology-independent knowledge and engineering judgment that stay
      valuable as AI-assisted development becomes common.
  - title: Career and interview readiness
    description: >-
      Strengthen coding, technical reasoning, system design and architectural
      communication for demanding engineering roles, as a result of depth
      rather than a substitute for it.
# Sections are chapters (ADR 0008). A subject starts as one section and is
# divided into adjacent chapter sections once its curriculum is structured.
# Subjects follow prerequisite order. The planned topics are the owner's initial
# scope (requested 2026-11-12); each becomes one or more lessons, one teaching
# unit per page. Overviews live in src/content/subjects/.
sections:
  # Computer Architecture & Execution, restructured into six chapters on
  # 2026-11-13 at the owner's request. Existing lessons keep their URLs. A
  # planned page split from an existing lesson takes over that material when
  # it is drafted; until then the existing lesson still teaches it. Planned
  # rows display after a chapter's lessons; comments give intended positions.
  - id: architecture-machine-state
    title: Machine state and data representation
    subject: computer-architecture-execution
    lessons:
      - computer-architecture-execution/how-computers-execute-programs
      - computer-architecture-execution/binary-and-data-representation
      - computer-architecture-execution/floating-point-representation
      - computer-architecture-execution/text-encoding-and-memory-layout
  - id: architecture-source-to-process
    title: From source to running process
    subject: computer-architecture-execution
    lessons:
      - computer-architecture-execution/cpu-registers-and-instructions
      - computer-architecture-execution/reading-assembly
      - computer-architecture-execution/compilation-and-execution
      - computer-architecture-execution/stack-and-heap
  - id: architecture-memory-hierarchy
    title: The memory hierarchy
    subject: computer-architecture-execution
    lessons:
      - computer-architecture-execution/memory-hierarchy-and-caches
      - computer-architecture-execution/cache-organization
      - computer-architecture-execution/dram-ssd-and-disks
    # cache-organization took associativity and write policies from
    # memory-hierarchy-and-caches, which keeps the hierarchy, locality and
    # access costs. The storage page completes the approved topic "Memory
    # hierarchy, caches, RAM, and storage".
  - id: architecture-processor
    title: Inside the processor
    subject: computer-architecture-execution
    # The first three split from architecture-and-performance. Multicore was
    # proposed by an agent review on 2026-11-13: coherence (MESI-style
    # ownership), store buffers and memory ordering, fences, atomic
    # read-modify-write instructions, false sharing, and the costs of hardware
    # threads and NUMA. It takes the coherence material from
    # hardware-software-interaction. Locks, condition variables and deadlock
    # stay with the OS subject's concurrency topics.
    lessons:
      - computer-architecture-execution/pipelining-and-hazards
      - computer-architecture-execution/branch-prediction-and-speculation
      - computer-architecture-execution/simd-and-data-parallelism
      - computer-architecture-execution/multicore-coherence-and-atomics
  - id: architecture-devices
    title: Devices and the hardware–software boundary
    subject: computer-architecture-execution
    lessons:
      - computer-architecture-execution/hardware-software-interaction
      - computer-architecture-execution/io-mechanisms
  - id: architecture-performance
    title: Performance on real hardware
    subject: computer-architecture-execution
    lessons:
      - computer-architecture-execution/architecture-and-performance
      - computer-architecture-execution/measuring-performance
  # Operating Systems & Runtime Internals, divided into ten chapters on
  # 2026-11-26 from the owner-approved proposal
  # (docs/proposals/operating-systems-runtime-internals.md, approved
  # 2026-11-25). Planned titles are the approved pages in drafting order, and
  # each chapter's comment gives their lesson slugs. Privilege entry, the TLB,
  # coherence and atomic instructions, and tracing GC basics stay with
  # Computer Architecture & Execution; these chapters link to it.
  - id: os-kernel-boundary
    title: The kernel boundary and processes
    subject: operating-systems-runtime-internals
    # system-calls, processes, threads, scheduling, context-switches
    lessons:
      - operating-systems-runtime-internals/system-calls
      - operating-systems-runtime-internals/processes
      - operating-systems-runtime-internals/threads
      - operating-systems-runtime-internals/scheduling
    planned:
      - 'Context switches: What switching costs'
  - id: os-memory
    title: Memory
    subject: operating-systems-runtime-internals
    # page-tables, page-faults, resident-memory, allocators
    planned:
      - 'Page tables: Translating an address'
      - Page faults, copy-on-write and overcommit
      - Resident memory and the page cache
      - 'Allocators: Why freed memory stays'
  - id: os-concurrency
    title: Concurrency and synchronization
    subject: operating-systems-runtime-internals
    # race-conditions, mutexes, condition-variables, semaphores, deadlock
    planned:
      - Race conditions and critical sections
      - Mutexes, futexes and contention
      - Condition variables and bounded queues
      - Semaphores and reader–writer locks
      - Deadlock and lock ordering
  - id: os-files-io
    title: Files and I/O for services
    subject: operating-systems-runtime-internals
    # file-descriptors, epoll, io-uring, fsync
    planned:
      - File descriptors and the open-file table
      - Blocking, non-blocking and readiness with epoll
      - Completion-based I/O with io_uring
      - 'Durability: What fsync promises'
  - id: os-containers
    title: Containers and process control
    subject: operating-systems-runtime-internals
    # namespaces, cgroups-cpu, memory-limits, signals
    planned:
      - 'Namespaces: What a container sees'
      - 'cgroups: CPU quotas and throttling'
      - Memory limits and OOM kills
      - Signals, pipes and graceful shutdown
  - id: os-diagnostics
    title: Linux diagnostics
    subject: operating-systems-runtime-internals
    # use-method, stuck-processes, flame-graphs
    planned:
      - The USE method on one host
      - Diagnosing a stuck process
      - CPU profiles and flame graphs
  - id: os-runtime-models
    title: Runtime models
    subject: operating-systems-runtime-internals
    # concurrency-models, gc-designs
    planned:
      - 'Concurrency models: Event loop, threads, M:N'
      - Garbage collection designs
  - id: os-nodejs
    title: Node.js and V8
    subject: operating-systems-runtime-internals
    # event-loop, microtasks, blocking-the-loop
    planned:
      - The libuv event loop and its thread pool
      - Microtasks, promises and nextTick
      - "Blocking the loop and V8's garbage collector"
  - id: os-jvm
    title: The JVM
    subject: operating-systems-runtime-internals
    # jvm-execution, jvm-g1, jvm-zgc, jvm-threads
    planned:
      - Bytecode, interpretation and JIT tiers
      - Heap generations and the G1 collector
      - Low-latency collection with ZGC
      - Platform threads, virtual threads and thread dumps
  - id: os-go-runtime
    title: Go and choosing a runtime
    subject: operating-systems-runtime-internals
    # go-scheduler, go-gc, go-concurrency, choosing-a-runtime
    planned:
      - Goroutines and the G-M-P scheduler
      - "Go's garbage collector, GOGC and GOMEMLIMIT"
      - Channels, the memory model and data races
      - Choosing a runtime and sizing pools
  - id: computer-networking
    title: Computer Networking
    subject: computer-networking
    planned:
      - Network architecture and communication models
      - Ethernet and local networking
      - IP addressing and subnetting
      - Routing, NAT, and firewalls
      - TCP and UDP internals
      - Sockets and network programming
      - DNS resolution
      - HTTP/1.1, HTTP/2, and HTTP/3
      - TLS and secure communication
      - Reverse proxies, gateways, and load balancing
      - Connection management and network performance
      - Network troubleshooting and packet analysis
  - id: databases-storage-systems
    title: Databases & Storage Systems
    subject: databases-storage-systems
    planned:
      - Database architecture and storage engines
      - Relational data modeling
      - Indexing and data structures
      - B-trees, B+ trees, and LSM trees
      - Query planning and optimization
      - Transactions and ACID properties
      - Isolation levels, locking, and MVCC
      - Concurrency control
      - Write-ahead logging and recovery
      - Replication and partitioning
      - Relational vs NoSQL architecture
      - Caching and storage performance
  - id: software-engineering-architecture
    title: Software Engineering & Architecture
    subject: software-engineering-architecture
    planned:
      - Software design principles
      - Modularity, cohesion, and coupling
      - Abstractions and interfaces
      - Programming paradigms
      - Object-oriented and functional design fundamentals
      - Design patterns and their trade-offs
      - API and contract design
      - Component and service boundaries
      - Code quality and maintainability
      - Testing strategies and testability
      - Refactoring and software evolution
      - Architectural styles and patterns
      - Architecture decision records
      - Technical debt and engineering trade-offs
  - id: distributed-systems
    title: Distributed Systems
    subject: distributed-systems
    planned:
      - Distributed computing fundamentals
      - Communication between distributed components
      - Network failures and partial failures
      - Consistency and availability
      - Replication and partitioning
      - Consensus and leader election
      - Distributed coordination
      - Messaging and event-driven systems
      - Delivery guarantees and message ordering
      - Retries, timeouts, and idempotency
      - Distributed transactions and sagas
      - Fault tolerance and resilience
      - Distributed state management
      - Scalability and architectural trade-offs
  - id: security-performance-reliability
    title: Security, Performance & Reliability
    subject: security-performance-reliability
    planned:
      - Security engineering fundamentals
      - Threat modeling and trust boundaries
      - Authentication and authorization
      - Cryptography fundamentals and practical applications
      - Secrets and credential management
      - Secure application and API design
      - Vulnerability classes and defensive engineering
      - Application profiling and performance analysis
      - Latency, throughput, and resource utilization
      - Load testing and capacity planning
      - Logging, metrics, and distributed tracing
      - Observability and production diagnostics
      - Reliability engineering and failure recovery
      - SLI, SLO, and error budgets
      - Incident analysis and continuous improvement
