name: The Java Virtual Machine Specification, Java SE 21 Edition
kind: specification
by: Tim Lindholm, Frank Yellin, Gilad Bracha, Alex Buckley and Daniel Smith
url: https://docs.oracle.com/javase/specs/jvms/se21/html/
description: >-
